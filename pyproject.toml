[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fronius-smart-meter-emulator"
version = "0.1.0"
description = "Combined Shelly production meter emulator for Fronius Verto Plus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests==2.34.2",
]

[project.scripts]
fronius-smart-meter-emulator = "fronius_emulator.app:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
